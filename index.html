<title>Crew Rest Planner</title>
<style>
  :root {
    --bg: #0A0C0F;
    --panel: #11151A;
    --panel-border: #1E252D;
    --amber: #FFB300;
    --teal: #2DD4BF;
    --text: #ECEAE4;
    --muted: #7A8290;
    --gap: #1A1F26;
    --error: #FF6B5C;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior-y: none;
  }
  body { padding: max(28px, env(safe-area-inset-top)) 16px max(40px, env(safe-area-inset-bottom)); }
  .wrap { max-width: 480px; margin: 0 auto; }
  .eyebrow {
    font-family: "SF Mono", "Menlo", monospace; font-size: 11px; letter-spacing: 0.18em;
    color: var(--amber); margin-bottom: 4px;
  }
  h1 { font-size: 28px; font-weight: 700; margin: 0 0 2px; letter-spacing: 0.01em; }
  .sub { font-size: 13px; color: var(--muted); margin-bottom: 22px; }
  .panel {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 18px; margin-bottom: 16px;
  }
  label.field-label {
    display: block; font-size: 11px; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 6px;
  }
  .row { display: flex; gap: 12px; margin-bottom: 16px; }
  .row > div { flex: 1; }
  select {
    background: var(--bg); border: 1px solid var(--panel-border); border-radius: 8px;
    color: var(--text); font-family: "SF Mono", "Menlo", monospace; font-size: 18px;
    padding: 10px 4px; text-align: center; text-align-last: center;
    appearance: none; -webkit-appearance: none; width: 100%; cursor: pointer;
  }
  .time-select { display: flex; gap: 6px; align-items: center; }
  .time-select select { width: 50%; }
  .time-select span { color: var(--muted); font-family: monospace; }
  .seg { display: flex; gap: 6px; background: var(--bg); border-radius: 10px; padding: 4px; border: 1px solid var(--panel-border); }
  .seg button {
    flex: 1; padding: 10px 12px; background: transparent; color: var(--muted);
    border: none; border-radius: 8px; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; cursor: pointer;
  }
  .seg button.active { background: var(--amber); color: #1A1200; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0; }
  .toggle-btn {
    background: transparent; color: var(--muted); border: 1px solid var(--panel-border); border-radius: 20px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em; padding: 5px 12px; cursor: pointer; flex-shrink: 0; margin-left: 10px;
  }
  .toggle-btn.on { background: var(--amber); color: #1A1200; border-color: var(--amber); }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button {
    width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--panel-border);
    background: var(--bg); color: var(--amber); font-size: 20px; line-height: 1; cursor: pointer; flex-shrink: 0;
  }
  .stepper .val {
    flex: 1; text-align: center; font-family: "SF Mono", monospace; font-size: 18px;
    background: var(--bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 10px 0;
  }
  .error-box {
    background: #1F1315; border: 1px solid var(--error); border-radius: 12px; padding: 16px;
    color: var(--error); font-size: 14px; line-height: 1.5;
  }
  .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .stat { flex: 1; min-width: 90px; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; padding: 10px 12px; }
  .stat .l { font-size: 10px; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 4px; }
  .stat .v { font-family: "SF Mono", monospace; font-size: 16px; font-weight: 700; }
  .timeline-label { font-size: 11px; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 10px; }
  .timeline-bar { display: flex; width: 100%; height: 40px; border-radius: 8px; overflow: hidden; background: var(--gap); }
  .timeline-ends { display: flex; justify-content: space-between; margin-top: 8px; font-family: "SF Mono", monospace; font-size: 11px; color: var(--muted); }
  .cards { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px;
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
  }
  .card .name { font-size: 15px; font-weight: 600; }
  .card .dur { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .card .times { font-family: "SF Mono", monospace; font-size: 17px; text-align: right; }
  .card .times .end { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">FLIGHT DECK UTILITY · 24HR · OFFLINE</div>
  <h1>Crew Rest Planner</h1>
  <div class="sub">Splits your cruise rest window across the flight crew</div>

  <div class="panel">
    <div class="row">
      <div>
        <label class="field-label">START OF REST</label>
        <div class="time-select">
          <select id="startH"></select><span>:</span><select id="startM"></select>
        </div>
      </div>
      <div>
        <label class="field-label">END OF REST</label>
        <div class="time-select">
          <select id="endH"></select><span>:</span><select id="endM"></select>
        </div>
      </div>
    </div>

    <div style="margin-bottom:16px;">
      <label class="field-label">CREW SETUP</label>
      <div class="seg">
        <button id="crew3" class="active">3 CREW</button>
        <button id="crew4">4 CREW · 2 GROUPS</button>
      </div>
    </div>

    <div id="rtsSection" style="display:none; margin-bottom:16px;">
      <div class="toggle-row" style="margin-bottom:10px;">
        <label class="field-label" style="margin-bottom:0;">RETURN TO SEAT (SPLITS GROUP A'S REST AROUND GROUP B)</label>
        <button id="rtsToggle" class="toggle-btn">OFF</button>
      </div>
      <div id="rtsPickerWrap" style="display:none;">
        <div class="time-select">
          <select id="rtsH"></select><span>:</span><select id="rtsM"></select>
        </div>
      </div>
    </div>

    <div>
      <label class="field-label">INTERMISSION BETWEEN RESTS</label>
      <div class="stepper">
        <button id="intMinus">−</button>
        <div class="val" id="intVal">10 min</div>
        <button id="intPlus">+</button>
      </div>
    </div>
  </div>

  <div id="results"></div>
</div>

<script>
  const COLORS = ["#FFB300", "#2DD4BF", "#FFB300", "#2DD4BF"];

  function pad2(n) { return String(n).padStart(2, "0"); }
  function parseTime(t) {
    if (!t) return null;
    const [h, m] = t.split(":").map(Number);
    if (Number.isNaN(h) || Number.isNaN(m)) return null;
    return h * 60 + m;
  }
  function formatClock(totalMin) {
    const rounded = Math.round(totalMin);
    const day = Math.floor(rounded / 1440);
    const m = ((rounded % 1440) + 1440) % 1440;
    const h = Math.floor(m / 60);
    const mm = m % 60;
    const clock = pad2(h) + ":" + pad2(mm);
    return day > 0 ? clock + " +" + day : clock;
  }
  function formatDuration(minRaw) {
    const min = Math.round(minRaw);
    const h = Math.floor(min / 60);
    const m = min % 60;
    if (h === 0) return m + "m";
    if (m === 0) return h + "h";
    return h + "h " + m + "m";
  }

  function computeSchedule({ startTime, endTime, crewSetup, intermission, returnToSeat }) {
    const startMin = parseTime(startTime);
    let endMin = parseTime(endTime);
    if (startMin === null || endMin === null) return { error: "Enter both start and end of rest." };
    if (endMin <= startMin) endMin += 1440;

    const totalWindow = endMin - startMin;
    const useReturnToSeat = crewSetup === 4 && !!returnToSeat;

    if (useReturnToSeat) {
      let rtsMin = parseTime(returnToSeat);
      if (rtsMin === null) return { error: "Enter a valid return to seat time." };
      if (rtsMin <= startMin) rtsMin += 1440;
      rtsMin = Math.round(rtsMin);

      if (rtsMin <= startMin) return { error: "Return to seat time must be after start of rest." };
      if (rtsMin >= endMin) return { error: "Return to seat time must be before end of rest." };

      const a2Duration = endMin - rtsMin;
      const totalAvail = totalWindow - intermission;
      if (totalAvail <= 0) {
        return { error: "Intermission time (" + formatDuration(intermission) + ") leaves no room for rest in a " + formatDuration(totalWindow) + " window." };
      }

      const bDuration = totalAvail / 2;
      const a1Duration = bDuration - a2Duration;
      if (a1Duration < 0) {
        return { error: "Return to seat is too close to end of rest — Group A's first rest would go negative (Part 2 alone is already " + formatDuration(a2Duration) + ", more than half the available rest). Move return to seat earlier." };
      }

      const a1Start = startMin;
      const a1End = Math.round(a1Start + a1Duration);
      const bStart = Math.round(a1End + intermission);
      const bEnd = rtsMin;
      const a2Start = rtsMin;
      const a2End = endMin;

      const periods = [
        { label: "Group A Rest — Part 1", start: a1Start, end: a1End, duration: a1End - a1Start },
        { label: "Group B Rest", start: bStart, end: bEnd, duration: bEnd - bStart },
        { label: "Group A Rest — Part 2", start: a2Start, end: a2End, duration: a2End - a2Start },
      ];

      return { totalWindow, totalIntermission: intermission, unequal: true, periods, startMin, endMin };
    }

    const groups = crewSetup === 3 ? 3 : 2;
    const gaps = groups - 1;
    const totalIntermission = intermission * gaps;
    const availableRest = totalWindow - totalIntermission;

    if (availableRest <= 0) {
      return { error: "Intermission time (" + formatDuration(totalIntermission) + " total) leaves no room for rest in a " + formatDuration(totalWindow) + " window." };
    }

    const perPeriod = availableRest / groups;
    const periods = [];
    let cursor = startMin;
    for (let i = 0; i < groups; i++) {
      const pStart = Math.round(cursor);
      const pEnd = Math.round(cursor + perPeriod);
      periods.push({
        label: crewSetup === 3 ? "Crew " + (i + 1) + " Rest" : "Group " + String.fromCharCode(65 + i) + " Rest",
        start: pStart, end: pEnd, duration: pEnd - pStart,
      });
      cursor = pEnd;
      if (i < groups - 1 && intermission > 0) cursor += intermission;
    }

    return { totalWindow, perPeriod, totalIntermission, unequal: false, periods, startMin, endMin };
  }

  // ---- state ----
  const state = {
    startTime: "22:00",
    endTime: "06:00",
    crewSetup: 3,
    intermission: 10,
    useReturnToSeat: false,
    returnToSeat: "01:00",
  };

  function fillHourMinSelect(sel, max) {
    sel.innerHTML = "";
    for (let i = 0; i < max; i++) {
      const opt = document.createElement("option");
      opt.value = pad2(i);
      opt.textContent = pad2(i);
      sel.appendChild(opt);
    }
  }

  const startH = document.getElementById("startH"), startM = document.getElementById("startM");
  const endH = document.getElementById("endH"), endM = document.getElementById("endM");
  const rtsH = document.getElementById("rtsH"), rtsM = document.getElementById("rtsM");
  [startH, endH, rtsH].forEach(s => fillHourMinSelect(s, 24));
  [startM, endM, rtsM].forEach(s => fillHourMinSelect(s, 60));

  function syncSelectsFromState() {
    const [sh, sm] = state.startTime.split(":");
    const [eh, em] = state.endTime.split(":");
    const [rh, rm] = state.returnToSeat.split(":");
    startH.value = sh; startM.value = sm;
    endH.value = eh; endM.value = em;
    rtsH.value = rh; rtsM.value = rm;
  }
  syncSelectsFromState();

  startH.onchange = startM.onchange = () => { state.startTime = startH.value + ":" + startM.value; render(); };
  endH.onchange = endM.onchange = () => { state.endTime = endH.value + ":" + endM.value; render(); };
  rtsH.onchange = rtsM.onchange = () => { state.returnToSeat = rtsH.value + ":" + rtsM.value; render(); };

  const crew3Btn = document.getElementById("crew3"), crew4Btn = document.getElementById("crew4");
  crew3Btn.onclick = () => { state.crewSetup = 3; render(); };
  crew4Btn.onclick = () => { state.crewSetup = 4; render(); };

  const rtsToggle = document.getElementById("rtsToggle");
  rtsToggle.onclick = () => { state.useReturnToSeat = !state.useReturnToSeat; render(); };

  const intMinus = document.getElementById("intMinus"), intPlus = document.getElementById("intPlus");
  intMinus.onclick = () => { state.intermission = Math.max(0, state.intermission - 5); render(); };
  intPlus.onclick = () => { state.intermission = Math.min(60, state.intermission + 5); render(); };

  const resultsEl = document.getElementById("results");

  function render() {
    crew3Btn.classList.toggle("active", state.crewSetup === 3);
    crew4Btn.classList.toggle("active", state.crewSetup === 4);
    document.getElementById("rtsSection").style.display = state.crewSetup === 4 ? "block" : "none";
    rtsToggle.classList.toggle("on", state.useReturnToSeat);
    rtsToggle.textContent = state.useReturnToSeat ? "ON" : "OFF";
    document.getElementById("rtsPickerWrap").style.display = state.useReturnToSeat ? "block" : "none";
    document.getElementById("intVal").textContent = state.intermission + " min";

    const result = computeSchedule({
      startTime: state.startTime,
      endTime: state.endTime,
      crewSetup: state.crewSetup,
      intermission: state.intermission,
      returnToSeat: state.crewSetup === 4 && state.useReturnToSeat ? state.returnToSeat : null,
    });

    if (result.error) {
      resultsEl.innerHTML = '<div class="error-box">' + result.error + "</div>";
      return;
    }

    let statsHtml = '<div class="stats">';
    statsHtml += stat("REST WINDOW", formatDuration(result.totalWindow));
    if (result.unequal) {
      statsHtml += stat("A · PART 1", formatDuration(result.periods[0].duration));
      statsHtml += stat("GROUP B", formatDuration(result.periods[1].duration));
      statsHtml += stat("A · PART 2", formatDuration(result.periods[2].duration));
    } else {
      statsHtml += stat("PER PERIOD", formatDuration(result.perPeriod));
    }
    statsHtml += stat("INTERMISSION", result.totalIntermission > 0 ? formatDuration(result.totalIntermission) : "—");
    statsHtml += "</div>";

    let timelineSegs = "";
    result.periods.forEach((p, i) => {
      const prevEnd = i > 0 ? result.periods[i - 1].end : p.start;
      const gapBefore = p.start - prevEnd;
      const segWidth = (p.duration / result.totalWindow) * 100;
      const gapWidth = (gapBefore / result.totalWindow) * 100;
      const total = segWidth + gapWidth;
      timelineSegs += '<div style="display:flex;width:' + total + '%">';
      if (gapWidth > 0) {
        timelineSegs += '<div style="width:' + ((gapWidth / total) * 100) + '%;background:var(--gap)"></div>';
      }
      timelineSegs += '<div style="width:' + ((segWidth / total) * 100) + '%;background:' + COLORS[i % 4] +
        ';display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:11px;font-weight:700;color:#0A0C0F">' + (i + 1) + '</div>';
      timelineSegs += "</div>";
    });

    let cardsHtml = "";
    result.periods.forEach((p, i) => {
      cardsHtml += '<div class="card" style="border-left:4px solid ' + COLORS[i % 4] + '">' +
        '<div><div class="name">' + p.label + '</div><div class="dur">' + formatDuration(p.duration) + '</div></div>' +
        '<div class="times"><div>' + formatClock(p.start) + '</div><div class="end">' + formatClock(p.end) + '</div></div>' +
        '</div>';
    });

    resultsEl.innerHTML = statsHtml +
      '<div class="panel">' +
        '<div class="timeline-label">REST TIMELINE</div>' +
        '<div class="timeline-bar">' + timelineSegs + '</div>' +
        '<div class="timeline-ends"><span>' + formatClock(result.startMin) + '</span><span>' + formatClock(result.endMin) + '</span></div>' +
      '</div>' +
      '<div class="cards">' + cardsHtml + '</div>';
  }

  function stat(label, value) {
    return '<div class="stat"><div class="l">' + label + '</div><div class="v">' + value + '</div></div>';
  }

  render();
</script>
</body>
</html>
